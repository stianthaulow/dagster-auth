name: Publish

# Publishes to PyPI when a version tag is pushed. Uses trusted publishing, so
# no API token is stored in the repo.
#
# BEFORE THE FIRST RELEASE, register a *pending* publisher. The project does
# not exist on PyPI yet, so the per-project settings page does not exist
# either; use the account-level page instead:
#
#   https://pypi.org/manage/account/publishing/  ->  "Add a new pending publisher"
#
#   PyPI Project Name:  dagster-authentication
#   Owner:              flowbytedev
#   Repository name:    dagster-auth
#   Workflow name:      publish.yml
#   Environment name:   pypi
#
# Every field is matched exactly against the OIDC claims. Renaming the GitHub
# repository after registering breaks the match and the publish fails with
# `invalid-publisher` - update the publisher on PyPI when you rename.
#
# After the first successful publish the pending publisher becomes a normal
# one, editable at:
#   https://pypi.org/manage/project/dagster-authentication/settings/publishing/

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest ruff
      - run: ruff check .
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      # Catches metadata that PyPI would reject after a tag is already pushed.
      - run: pip install twine && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
